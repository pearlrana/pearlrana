<svg width="920" height="260" viewBox="0 0 920 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated diagram of a React frontend, FastAPI backend and SQL database connected by a running data pipeline, next to a terminal panel">
  <defs>
    <pattern id="grid-d" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1b212a" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade-d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="920" height="260" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <rect x="1" y="1" width="918" height="258" rx="13" fill="url(#grid-d)"/>

  <!-- ===== Terminal panel ===== -->
  <g>
    <rect x="20" y="20" width="380" height="220" rx="10" fill="#0a0d12" stroke="#21262d" stroke-width="1"/>
    <circle cx="38" cy="38" r="4.5" fill="#ff5f56"/>
    <circle cx="53" cy="38" r="4.5" fill="#ffbd2e"/>
    <circle cx="68" cy="38" r="4.5" fill="#27c93f"/>
    <text x="200" y="42" text-anchor="middle" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="11" fill="#6e7681">pearl@dev — zsh</text>
    <line x1="20" y1="54" x2="400" y2="54" stroke="#21262d" stroke-width="1"/>

    <g font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="13.5">
      <g opacity="0">
        <text x="38" y="82" fill="#7c9cff">$</text>
        <text x="52" y="82" fill="#c9d1d9">whoami</text>
        <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.03;1" dur="9s" begin="0s" repeatCount="indefinite"/>
      </g>
      <g opacity="0">
        <text x="38" y="104" fill="#8b949e">pearl-rana</text>
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.08;0.11;1" dur="9s" begin="0s" repeatCount="indefinite"/>
      </g>

      <g opacity="0">
        <text x="38" y="134" fill="#7c9cff">$</text>
        <text x="52" y="134" fill="#c9d1d9">stack --status</text>
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.18;0.22;1" dur="9s" begin="0s" repeatCount="indefinite"/>
      </g>

      <g opacity="0">
        <text x="38" y="158" fill="#3fb950">✓</text>
        <text x="54" y="158" fill="#8b949e">react.js</text>
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.30;0.34;1" dur="9s" begin="0s" repeatCount="indefinite"/>
      </g>
      <g opacity="0">
        <text x="38" y="178" fill="#3fb950">✓</text>
        <text x="54" y="178" fill="#8b949e">fastapi</text>
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.38;0.42;1" dur="9s" begin="0s" repeatCount="indefinite"/>
      </g>
      <g opacity="0">
        <text x="38" y="198" fill="#3fb950">✓</text>
        <text x="54" y="198" fill="#8b949e">sql</text>
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.46;0.50;1" dur="9s" begin="0s" repeatCount="indefinite"/>
      </g>

      <g opacity="0">
        <text x="38" y="222" fill="#58e6d9">build successful</text>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.58;0.62;0.94;1" dur="9s" begin="0s" repeatCount="indefinite"/>
      </g>
    </g>

    <rect x="38" y="226" width="8" height="14" fill="#7c9cff">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ===== Node graph ===== -->
  <g font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="11.5" letter-spacing="0.5">
    <!-- connectors -->
    <path id="path-fb-d" d="M 560 78 C 630 78, 630 78, 700 130" fill="none" stroke="#21262d" stroke-width="2"/>
    <path id="path-bd-d" d="M 700 150 C 630 200, 630 200, 560 210" fill="none" stroke="#21262d" stroke-width="2"/>

    <circle r="4.5" fill="#7c9cff">
      <animateMotion dur="3.2s" repeatCount="indefinite" begin="0s">
        <mpath href="#path-fb-d"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.5" fill="#58e6d9">
      <animateMotion dur="3.2s" repeatCount="indefinite" begin="1.6s">
        <mpath href="#path-bd-d"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Frontend node -->
    <g transform="translate(560,78)">
      <circle r="16" fill="none" stroke="#7c9cff" stroke-width="1" opacity="0.35">
        <animate attributeName="r" values="16;26;16" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.35;0;0.35" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle r="16" fill="#101623" stroke="#7c9cff" stroke-width="1.5"/>
      <text text-anchor="middle" y="4" fill="#7c9cff" font-size="13">⬡</text>
      <text text-anchor="middle" y="34" fill="#c9d1d9" font-size="12">REACT</text>
      <text text-anchor="middle" y="49" fill="#6e7681" font-size="10">frontend</text>
    </g>

    <!-- Backend node -->
    <g transform="translate(700,140)">
      <circle r="16" fill="none" stroke="#58e6d9" stroke-width="1" opacity="0.35">
        <animate attributeName="r" values="16;26;16" dur="3s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.35;0;0.35" dur="3s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle r="16" fill="#0d1a1c" stroke="#58e6d9" stroke-width="1.5"/>
      <text text-anchor="middle" y="4" fill="#58e6d9" font-size="13">⬢</text>
      <text text-anchor="middle" y="34" fill="#c9d1d9" font-size="12">FASTAPI</text>
      <text text-anchor="middle" y="49" fill="#6e7681" font-size="10">backend</text>
    </g>

    <!-- Database node -->
    <g transform="translate(560,210)">
      <circle r="16" fill="none" stroke="#f2cc60" stroke-width="1" opacity="0.35">
        <animate attributeName="r" values="16;26;16" dur="3s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.35;0;0.35" dur="3s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <circle r="16" fill="#1a1509" stroke="#f2cc60" stroke-width="1.5"/>
      <text text-anchor="middle" y="4" fill="#f2cc60" font-size="13">⛁</text>
      <text text-anchor="middle" y="34" fill="#c9d1d9" font-size="12">SQL</text>
      <text text-anchor="middle" y="49" fill="#6e7681" font-size="10">database</text>
    </g>

    <text x="800" y="40" fill="#3fb950" font-size="11" text-anchor="middle" opacity="0">
      request → response
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.9;1" dur="3.2s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
